name: application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  record-only:
    name: record-only and drift (no model)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record-only smoke without a model or internal packages
        run: bash scripts/record_only_smoke.sh
      - name: Version and workflow drift
        run: python scripts/check_drift.py
      - name: Frontend syntax and render fixture
        run: |
          node --check < src/qone_life/static/app.js
          node --input-type=module - < tests/test_app_render.mjs

  application-fixtures:
    name: application tests with model fixtures
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install .
      - name: Unit tests use injected fixtures
        run: python -m unittest discover -s tests -v
