[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "q-one-life"
version = "0.8.0.dev0"
description = "A local personal ontology and review layer for the Q-One system."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Q-One contributors"}]
dependencies = ["fastapi==0.162.4", "uvicorn==0.34.0", "httpx==0.28.1", "portalocker==4.4.1", "cryptography==50.0.2", "argon2-cffi==25.1.0", "q-one-core[adaptive] @ git+https://github.com/aidless/q-one-core.git@b1f41dea59eb9d26b66e812f3fc167b83c23d7cf", "q-one-agent @ git+https://github.com/aidless/q-one-agent.git@79a951ac4e4f77239a227cfe28ffdc0fb30bc19f"]

[project.scripts]
qone-life = "qone_life.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 显式 pin 规则集（不依赖 ruff 版本的默认值），CI 与本地可复现。
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PERF", "C4", "RUF", "TRY", "BLE", "PLW", "FURB"]
ignore = [
    "E501",    # 行宽由 line-length 控制
    "E701", "E702",  # 测试中允许单行 if/; 写法
    "RUF001", "RUF002", "RUF003",  # 中文全角标点是有意为之
    "TRY003",  # 中文长异常消息有意为之
    "TRY300", "TRY301",
    "B007", "B023",
    "PERF401",  # 显式循环可读性优于推导式
    "PLW2901", "PLW0108", "SIM105",
    "RUF005",   # 列表拼接可读性
]

[tool.setuptools.package-data]
qone_life = ["static/*.html", "static/*.css", "static/*.js", "static/*.json"]
