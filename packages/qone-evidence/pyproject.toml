[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qone-evidence"
version = "0.1.0"
description = "Minimal dependency-free claim ledger with hash-bound evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["."]
include = ["qone_evidence*"]
