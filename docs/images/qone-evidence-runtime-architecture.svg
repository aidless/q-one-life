<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paper" x1="80" y1="40" x2="1510" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F1E5"/>
      <stop offset="0.55" stop-color="#F4EBDD"/>
      <stop offset="1" stop-color="#E9F0E6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1F3B2E" flood-opacity="0.12"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#1F3B2E" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1600" height="980" fill="url(#paper)"/>
  <rect width="1600" height="980" fill="url(#grid)"/>

  <text x="86" y="92" fill="#17382C" font-family="Noto Sans CJK SC, sans-serif" font-size="44" font-weight="700">Q-One · 本地优先、证据可审计的个人决策 Agent</text>
  <text x="88" y="132" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="20">普通 Agent 给出建议；Q-One 同时要求建议能绑定输入、可复算、可恢复，并在证据不足时拒绝发布。</text>

  <g filter="url(#shadow)">
    <rect x="88" y="190" width="470" height="670" rx="28" fill="#FFFCF5" stroke="#D8CDBB"/>
    <rect x="548" y="190" width="462" height="670" rx="28" fill="#FFFCF5" stroke="#D8CDBB"/>
    <rect x="1040" y="190" width="472" height="670" rx="28" fill="#FFFCF5" stroke="#D8CDBB"/>
  </g>

  <rect x="118" y="224" width="156" height="34" rx="17" fill="#E1F0E8"/>
  <text x="140" y="247" fill="#1F5C46" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700">01 · 桌面边界</text>
  <rect x="578" y="224" width="178" height="34" rx="17" fill="#FFF0CC"/>
  <text x="600" y="247" fill="#765617" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700">02 · 本地执行面</text>
  <rect x="1070" y="224" width="190" height="34" rx="17" fill="#E8E9DF"/>
  <text x="1092" y="247" fill="#445449" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700">03 · 证据与恢复</text>

  <rect x="118" y="292" width="410" height="132" rx="18" fill="#F2F7F2" stroke="#BFD7C8"/>
  <text x="142" y="328" fill="#17382C" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">Renderer</text>
  <text x="142" y="358" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">contextIsolation = true</text>
  <text x="142" y="384" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">nodeIntegration = false</text>
  <text x="142" y="410" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">今日 · 目标 · 复盘 · 设置</text>

  <rect x="118" y="448" width="410" height="138" rx="18" fill="#FBF6EA" stroke="#DCCBA8"/>
  <text x="142" y="484" fill="#17382C" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">最小 preload API</text>
  <text x="142" y="514" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">文件选择 · safeStorage · 模型状态</text>
  <text x="142" y="540" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">不向页面暴露 capability 或密钥</text>
  <text x="142" y="566" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">外部导航与弹窗默认拒绝</text>

  <rect x="118" y="610" width="410" height="206" rx="18" fill="#17382C"/>
  <text x="142" y="648" fill="#F9F3E7" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">Electron main</text>
  <text x="142" y="681" fill="#C9DED1" font-family="Noto Sans CJK SC, sans-serif" font-size="17">一次性 256-bit capability</text>
  <text x="142" y="709" fill="#C9DED1" font-family="Noto Sans CJK SC, sans-serif" font-size="17">每次启动随机回环端口</text>
  <text x="142" y="737" fill="#C9DED1" font-family="Noto Sans CJK SC, sans-serif" font-size="17">同会话请求注入 X-QOne-Capability</text>
  <text x="142" y="765" fill="#C9DED1" font-family="Noto Sans CJK SC, sans-serif" font-size="17">崩溃重启上限：2 次</text>
  <text x="142" y="793" fill="#C9DED1" font-family="Noto Sans CJK SC, sans-serif" font-size="17">用户可见错误码，不展示后端异常</text>

  <rect x="578" y="292" width="402" height="164" rx="18" fill="#F2F7F2" stroke="#BFD7C8"/>
  <text x="602" y="328" fill="#17382C" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">PyInstaller sidecar</text>
  <text x="602" y="358" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">FastAPI · 仅监听 127.0.0.1</text>
  <text x="602" y="384" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">stdin 握手 · stdout 单行 ready</text>
  <text x="602" y="410" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">所有 /api/*（含 GET）校验 capability</text>
  <text x="602" y="436" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">统一 error.code · retryable · request_id</text>

  <rect x="578" y="476" width="402" height="146" rx="18" fill="#FBF6EA" stroke="#DCCBA8"/>
  <text x="602" y="512" fill="#17382C" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">Q-One core</text>
  <text x="602" y="542" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">目标 · 任务 · 观察 · 反馈</text>
  <text x="602" y="568" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">规则推荐与本地模型共享候选 ID</text>
  <text x="602" y="594" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">验证失败时明确回退到规则建议</text>

  <rect x="578" y="642" width="402" height="174" rx="18" fill="#F2F7F2" stroke="#BFD7C8"/>
  <text x="602" y="678" fill="#17382C" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">Qwen3-0.6B · 可选</text>
  <text x="602" y="708" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">固定 revision + 字节数 + SHA-256</text>
  <text x="602" y="734" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">node-llama-cpp 3.22.2</text>
  <text x="602" y="760" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">OpenAI-compatible loopback service</text>
  <text x="602" y="786" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">无模型、下载失败或内存不足时仍可完成闭环</text>

  <rect x="1070" y="292" width="412" height="164" rx="18" fill="#F2F7F2" stroke="#BFD7C8"/>
  <text x="1094" y="328" fill="#17382C" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">本地 SQLite + OS ACL</text>
  <text x="1094" y="358" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">目标、行动、观察、复盘与运行记录</text>
  <text x="1094" y="384" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">跨平台单实例与文件锁</text>
  <text x="1094" y="410" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">数据库格式版本与升级保护</text>
  <text x="1094" y="436" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">明文工作库不宣称端到端加密</text>

  <rect x="1070" y="476" width="412" height="146" rx="18" fill="#FBF6EA" stroke="#DCCBA8"/>
  <text x="1094" y="512" fill="#17382C" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">.qonebackup</text>
  <text x="1094" y="542" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">随机数据密钥 · AES-256-GCM</text>
  <text x="1094" y="568" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">恢复密钥经 Argon2id 包装数据密钥</text>
  <text x="1094" y="594" fill="#53695F" font-family="Noto Sans CJK SC, sans-serif" font-size="17">临时文件 · fsync · 原子替换 · staging 恢复</text>

  <rect x="1070" y="642" width="412" height="174" rx="18" fill="#17382C"/>
  <text x="1094" y="678" fill="#F9F3E7" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">证据门</text>
  <text x="1094" y="708" fill="#C9DED1" font-family="Noto Sans CJK SC, sans-serif" font-size="17">claim ledger · 输入/推荐 proposal hash</text>
  <text x="1094" y="734" fill="#C9DED1" font-family="Noto Sans CJK SC, sans-serif" font-size="17">载体复算 · clean-room compile</text>
  <text x="1094" y="760" fill="#C9DED1" font-family="Noto Sans CJK SC, sans-serif" font-size="17">17 个 pilot · 85 个 blocked claim</text>
  <text x="1094" y="786" fill="#C9DED1" font-family="Noto Sans CJK SC, sans-serif" font-size="17">默认拒绝：不能验证就不发布</text>

  <g stroke="#315F4C" stroke-width="3" stroke-linecap="round">
    <path d="M528 358H578"/>
    <path d="M528 721C550 721 554 721 578 721"/>
    <path d="M980 374H1040"/>
    <path d="M980 721H1040"/>
    <path d="M1276 456V476"/>
    <path d="M1276 622V642"/>
  </g>
  <g fill="#315F4C">
    <path d="M570 358L558 351V365L570 358Z"/>
    <path d="M570 721L558 714V728L570 721Z"/>
    <path d="M1032 374L1020 367V381L1032 374Z"/>
    <path d="M1032 721L1020 714V728L1032 721Z"/>
    <path d="M1276 470L1269 458H1283L1276 470Z"/>
    <path d="M1276 636L1269 624H1283L1276 636Z"/>
  </g>

  <rect x="88" y="892" width="1424" height="52" rx="16" fill="#17382C"/>
  <text x="116" y="924" fill="#F9F3E7" font-family="Noto Sans CJK SC, sans-serif" font-size="18">可复算原则：每条推荐都保留输入摘要、候选 ID、来源与 proposal hash；每次恢复先验证、再切换，失败则保留原数据。</text>
</svg>
