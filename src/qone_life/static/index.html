<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#efe9dc">
  <meta name="color-scheme" content="light">
  <title>Q-One</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%232a4639'/%3E%3Cpath d='M20 8a12 12 0 1 0 9 19' fill='none' stroke='%23f3ead9' stroke-width='3.2' stroke-linecap='round'/%3E%3Cpath d='m25 25 6 6' stroke='%23cc6b45' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/consumer.css">
  <script defer src="/static/consumer.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至主要内容</a>
  <header class="site-header">
    <a class="brand" href="#today" aria-label="Q-One 首页">
      <span class="brand-mark" aria-hidden="true">Q</span>
      <span class="brand-copy"><strong>Q-One</strong><small data-i18n="brand.tagline">把重要的事，向前一步</small></span>
    </a>
    <nav class="primary-nav" aria-label="主要导航">
      <button type="button" data-route="today" class="active" data-i18n="nav.today">今日</button>
      <button type="button" data-route="goals" data-i18n="nav.goals">目标</button>
      <button type="button" data-route="review" data-i18n="nav.review">复盘</button>
      <button type="button" data-route="settings" data-i18n="nav.settings">设置</button>
    </nav>
    <div class="header-actions">
      <span class="local-badge"><i aria-hidden="true"></i><span data-i18n="common.local">仅保存在本机</span></span>
      <a class="advanced-link" href="/advanced" data-i18n="nav.advanced">进阶</a>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <section class="loading-card" aria-live="polite">
      <span class="orbit" aria-hidden="true"></span>
      <p data-i18n="common.loading">正在打开你的本地空间…</p>
    </section>
  </main>
  <footer class="site-footer">
    <span>Q-One</span>
    <span data-i18n="footer.flow">观察 → 推荐 → 行动 → 回看</span>
    <span id="app-version">v0.8.0.dev0</span>
  </footer>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="consumer-dialog" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <h2 id="dialog-title"></h2>
      <button type="button" class="icon-button" data-action="close-dialog" aria-label="关闭">×</button>
    </div>
    <div id="dialog-body" class="dialog-body"></div>
  </dialog>
</body>
</html>
