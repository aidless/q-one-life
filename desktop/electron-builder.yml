appId: io.qone.life
productName: Q-One
executableName: q-one
icon: assets/icon.png
directories:
  output: release
afterPack: scripts/after-pack.cjs
files:
  - dist/**/*
  - package.json
  - node_modules/node-llama-cpp/**/*
  - node_modules/@node-llama-cpp/**/*
extraResources:
  - from: ../build/sidecar/qone-life-sidecar
    to: sidecar
  - from: update-public-keys.json
    to: update-public-keys.json
asar: true
asarUnpack:
  - node_modules/node-llama-cpp/**/*
  - node_modules/@node-llama-cpp/**/*
publish:
  provider: github
  owner: aidless
  repo: q-one-life
  releaseType: prerelease
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Q-One-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.productivity
  icon: assets/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: Q-One-${version}-mac-${arch}.${ext}
linux:
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
  icon: assets/icon.png
  synopsis: Local personal goals, actions, and reviews
  description: Q-One keeps personal goals, actions, and reviews on your device.
  artifactName: Q-One-${version}-linux-${arch}.${ext}
